# =============================================================================
# Deploy to Production Environment
# =============================================================================
# Triggers on merge to main/master. Requires manual approval.
#
# REQUIRED SECRETS (set in GitHub repo Settings > Secrets):
#   PROD_SSH_HOST        - Server IP or hostname
#   PROD_SSH_USER        - SSH username
#   PROD_SSH_KEY         - SSH private key (full content)
#   PROD_SSH_PORT        - SSH port (optional, defaults to 22)
#   PROD_DEPLOY_PATH     - Deployment path on server
#   PROD_PM2_APP_NAME    - PM2 process name (e.g., my-app-prod)
#
# OPTIONAL SECRETS:
#   PROD_ENV_FILE        - Base64-encoded .env file content
#   PROD_FIREBASE_KEY    - Base64-encoded Firebase service account JSON
#   SLACK_WEBHOOK_URL    - Slack webhook for deployment notifications
#
# SETUP: Create a GitHub Environment called "production" with
#        required reviewers for manual approval gate.
# =============================================================================

name: Deploy to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm production deployment"
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  APP_NAME: ${{ secrets.PROD_PM2_APP_NAME || 'app-prod' }}

jobs:
  # ===========================================================================
  # Pre-deploy CI checks
  # ===========================================================================
  ci-check:
    name: CI Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Security audit
        run: npm audit --production --audit-level=high

      - name: Syntax check
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -not -path "./.git/*" | head -100 | while read file; do
            node --check "$file" 2>&1 || { echo "❌ Syntax error in $file"; exit 1; }
          done

      - name: Run tests (if available)
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test && p.scripts.test !== 'echo \"Error: no test specified\" && exit 1' ? 0 : 1)" 2>/dev/null; then
            npm test
          else
            echo "⚠️ No test script - skipping"
          fi
        env:
          NODE_ENV: test
          CI: true

  # ===========================================================================
  # Manual approval gate (for workflow_dispatch)
  # ===========================================================================
  confirm-deploy:
    name: Confirm Deployment
    runs-on: ubuntu-latest
    needs: [ci-check]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "❌ Deployment not confirmed. Input 'deploy' to proceed."
            exit 1
          fi
          echo "✅ Deployment confirmed by ${{ github.actor }}"

  # ===========================================================================
  # Deploy to production
  # ===========================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [ci-check]
    if: |
      always() &&
      needs.ci-check.result == 'success' &&
      (github.event_name == 'push' || needs.confirm-deploy.result == 'success' || needs.confirm-deploy.result == 'skipped')
    environment:
      name: production
      url: https://${{ secrets.PROD_SSH_HOST }}
    steps:
      - name: Validate required secrets
        run: |
          MISSING=""
          if [ -z "${{ secrets.PROD_SSH_HOST }}" ]; then MISSING="$MISSING PROD_SSH_HOST"; fi
          if [ -z "${{ secrets.PROD_SSH_USER }}" ]; then MISSING="$MISSING PROD_SSH_USER"; fi
          if [ -z "${{ secrets.PROD_SSH_KEY }}" ]; then MISSING="$MISSING PROD_SSH_KEY"; fi
          if [ -z "${{ secrets.PROD_DEPLOY_PATH }}" ]; then MISSING="$MISSING PROD_DEPLOY_PATH"; fi

          if [ -n "$MISSING" ]; then
            echo "❌ Missing required secrets:$MISSING"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.PROD_SSH_PORT || 22 }} -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.PROD_SSH_PORT || 22 }} \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=no \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} \
            "echo '✅ SSH connection successful'"

      - name: Create deployment package
        run: |
          git archive --format=tar.gz --output=deploy.tar.gz HEAD
          echo "📦 Package size: $(du -h deploy.tar.gz | cut -f1)"

      - name: Upload deployment package
        run: |
          scp -i ~/.ssh/deploy_key \
            -P ${{ secrets.PROD_SSH_PORT || 22 }} \
            deploy.tar.gz \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/tmp/deploy-prod.tar.gz

      - name: Upload environment file
        if: ${{ secrets.PROD_ENV_FILE != '' }}
        run: |
          echo "${{ secrets.PROD_ENV_FILE }}" | base64 -d > /tmp/.env
          scp -i ~/.ssh/deploy_key \
            -P ${{ secrets.PROD_SSH_PORT || 22 }} \
            /tmp/.env \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:${{ secrets.PROD_DEPLOY_PATH }}/.env

      - name: Deploy to production server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.PROD_SSH_PORT || 22 }} \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} << 'DEPLOY_SCRIPT'

          set -e
          DEPLOY_PATH="${{ secrets.PROD_DEPLOY_PATH }}"
          APP_NAME="${{ env.APP_NAME }}"
          BACKUP_DIR="$DEPLOY_PATH/../backups-prod"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          echo "🚀 PRODUCTION DEPLOYMENT STARTING..."
          echo "Time: $(date -u)"

          # Create backup (keep more for prod)
          mkdir -p "$BACKUP_DIR"
          if [ -d "$DEPLOY_PATH" ] && [ "$(ls -A $DEPLOY_PATH 2>/dev/null)" ]; then
            echo "📋 Creating backup: backup_$TIMESTAMP"
            tar -czf "$BACKUP_DIR/backup_$TIMESTAMP.tar.gz" -C "$DEPLOY_PATH" . 2>/dev/null || true

            # Keep last 10 backups for prod
            ls -t "$BACKUP_DIR"/backup_*.tar.gz 2>/dev/null | tail -n +11 | xargs rm -f 2>/dev/null || true
          fi

          # Extract new code
          cd "$DEPLOY_PATH"
          tar -xzf /tmp/deploy-prod.tar.gz
          rm -f /tmp/deploy-prod.tar.gz

          # Install production dependencies only
          echo "📦 Installing production dependencies..."
          npm ci --production 2>&1 | tail -5

          # Run build if available
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)" 2>/dev/null; then
            echo "🔨 Running build..."
            NODE_ENV=production npm run build
          fi

          # Run migrations if available
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.migrate ? 0 : 1)" 2>/dev/null; then
            echo "🗄️ Running migrations..."
            npm run migrate
          fi

          # Graceful restart with PM2
          echo "♻️ Restarting application (graceful)..."
          if command -v pm2 &>/dev/null; then
            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              pm2 reload "$APP_NAME" --update-env
            else
              ENTRY=$(node -e "const p=require('./package.json'); console.log(p.main || 'server.js')")
              pm2 start "$ENTRY" --name "$APP_NAME" -i max
            fi
            pm2 save

            # Show status
            pm2 show "$APP_NAME" | head -20
          else
            echo "❌ PM2 not found!"
            exit 1
          fi

          echo "✅ Production deployment complete!"
          DEPLOY_SCRIPT

      - name: Health check
        run: |
          echo "🏥 Running production health check..."
          MAX_RETRIES=10
          RETRY_DELAY=15
          HEALTH_URL="http://${{ secrets.PROD_SSH_HOST }}:${{ secrets.PROD_PORT || 5000 }}/health"

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" 2>/dev/null || echo "000")

            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "404" ]; then
              echo "✅ Health check passed (HTTP $HTTP_STATUS)"
              exit 0
            fi

            echo "⏳ Waiting ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "🔄 PRODUCTION ROLLBACK INITIATED..."
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.PROD_SSH_PORT || 22 }} \
            ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} << 'ROLLBACK_SCRIPT'

          DEPLOY_PATH="${{ secrets.PROD_DEPLOY_PATH }}"
          BACKUP_DIR="$DEPLOY_PATH/../backups-prod"
          APP_NAME="${{ env.APP_NAME }}"

          LATEST_BACKUP=$(ls -t "$BACKUP_DIR"/backup_*.tar.gz 2>/dev/null | head -1)
          if [ -n "$LATEST_BACKUP" ]; then
            echo "Restoring from: $LATEST_BACKUP"
            cd "$DEPLOY_PATH"
            tar -xzf "$LATEST_BACKUP"
            npm ci --production 2>/dev/null
            pm2 reload "$APP_NAME" --update-env 2>/dev/null || true
            echo "✅ Rollback complete"
          else
            echo "❌ No backup found for rollback!"
          fi
          ROLLBACK_SCRIPT

      - name: Notify Slack (success)
        if: success() && secrets.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"✅ *Production Deployment Successful*\nRepo: ${{ github.repository }}\nCommit: \`${{ github.sha }}\`\nBy: ${{ github.actor }}\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack (failure)
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"❌ *Production Deployment FAILED - Rollback Initiated*\nRepo: ${{ github.repository }}\nCommit: \`${{ github.sha }}\`\nBy: ${{ github.actor }}\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Cleanup SSH
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ===========================================================================
  # Summary
  # ===========================================================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Deployment summary
        run: |
          echo "=============================="
          echo "  PRODUCTION DEPLOYMENT SUMMARY"
          echo "=============================="
          echo ""
          echo "Repository: ${{ github.repository }}"
          echo "Branch:     ${{ github.ref_name }}"
          echo "Commit:     ${{ github.sha }}"
          echo "Author:     ${{ github.actor }}"
          echo "Status:     ${{ needs.deploy.result }}"
          echo "Timestamp:  $(date -u)"
